name: Qcow workflow

on:
  push:
    tags:
      - "v*"
      - "test-v*"
  pull_request:
  workflow_dispatch:
    inputs:
      ubuntu_version:
        description: 'Ubuntu version (e.g. 24.04, 26.04)'
        required: true
        default: '24.04'
      ubuntu_codename:
        description: 'Ubuntu codename (e.g. noble)'
        required: true
        default: 'noble'
      docker_version:
        description: 'Docker version (e.g. 29.2.0, 29.4.1)'
        required: true
        default: '29.2.0'
      tag:
        description: 'Release tag name'
        required: true
        default: 'master'
      issue_number:
        description: 'Issue number to close after release'
        required: true
        type: string

permissions: write-all

env:
  UBUNTU_CODENAME: ${{ github.event.inputs.ubuntu_codename || 'noble' }}
  UBUNTU_VERSION: ${{ github.event.inputs.ubuntu_version || '24.04' }}
  DOCKER_VERSION: ${{ github.event.inputs.docker_version || '29.2.0' }}
  NERDCTL_VERSION: "2.2.1"
  FLANNEL_VERSION: "1.9.0-flannel1"
  FLANNEL_MINI_VERSION: "1.9.0"
  BINFMT_VERSION: "deploy/v7.0.0-28"
  BINFMT_QEMU_VERSION: "7.0.0"

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            arch_label: amd64
          - os: ubuntu-24.04-arm
            arch: aarch64
            arch_label: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Make scripts executable
        run: chmod -R +x scripts/

      - name: Build all runtimes
        run: |
          for runtime in none docker containerd incus; do
            echo "=== Building ${runtime} ==="
            make qcow \
              OS_ARCH="${{ matrix.arch }}" \
              UBUNTU_CODENAME="${UBUNTU_CODENAME}" \
              UBUNTU_VERSION="${UBUNTU_VERSION}" \
              DOCKER_VERSION="${DOCKER_VERSION}" \
              BINFMT_VERSION="${BINFMT_VERSION}" \
              BINFMT_QEMU_VERSION="${BINFMT_QEMU_VERSION}" \
              RUNTIME="${runtime}"
            ls -lah dist/img
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arch }}-imgs
          path: dist/img/*${{ matrix.arch_label }}*

  create-release:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
      issues: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: x86_64-imgs
          path: dist/img

      - uses: actions/download-artifact@v4
        with:
          name: aarch64-imgs
          path: dist/img

      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF##*/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update release
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          version="${UBUNTU_VERSION}"

          files=(
            "dist/img/ubuntu-${version}-minimal-cloudimg-amd64-none.qcow2"
            "dist/img/ubuntu-${version}-minimal-cloudimg-amd64-none.qcow2.sha512sum"
            "dist/img/ubuntu-${version}-minimal-cloudimg-amd64-none-vmlinuz"
            "dist/img/ubuntu-${version}-minimal-cloudimg-amd64-none-vmlinuz.sha512sum"
            "dist/img/ubuntu-${version}-minimal-cloudimg-arm64-none.qcow2"
            "dist/img/ubuntu-${version}-minimal-cloudimg-arm64-none.qcow2.sha512sum"
            "dist/img/ubuntu-${version}-minimal-cloudimg-arm64-none-vmlinuz"
            "dist/img/ubuntu-${version}-minimal-cloudimg-arm64-none-vmlinuz.sha512sum"
            "dist/img/ubuntu-${version}-minimal-cloudimg-amd64-docker.qcow2"
            "dist/img/ubuntu-${version}-minimal-cloudimg-amd64-docker.qcow2.sha512sum"
            "dist/img/ubuntu-${version}-minimal-cloudimg-amd64-docker-vmlinuz"
            "dist/img/ubuntu-${version}-minimal-cloudimg-amd64-docker-vmlinuz.sha512sum"
            "dist/img/ubuntu-${version}-minimal-cloudimg-arm64-docker.qcow2"
            "dist/img/ubuntu-${version}-minimal-cloudimg-arm64-docker.qcow2.sha512sum"
            "dist/img/ubuntu-${version}-minimal-cloudimg-arm64-docker-vmlinuz"
            "dist/img/ubuntu-${version}-minimal-cloudimg-arm64-docker-vmlinuz.sha512sum"
            "dist/img/ubuntu-${version}-minimal-cloudimg-amd64-containerd.qcow2"
            "dist/img/ubuntu-${version}-minimal-cloudimg-amd64-containerd.qcow2.sha512sum"
            "dist/img/ubuntu-${version}-minimal-cloudimg-amd64-containerd-vmlinuz"
            "dist/img/ubuntu-${version}-minimal-cloudimg-amd64-containerd-vmlinuz.sha512sum"
            "dist/img/ubuntu-${version}-minimal-cloudimg-arm64-containerd.qcow2"
            "dist/img/ubuntu-${version}-minimal-cloudimg-arm64-containerd.qcow2.sha512sum"
            "dist/img/ubuntu-${version}-minimal-cloudimg-arm64-containerd-vmlinuz"
            "dist/img/ubuntu-${version}-minimal-cloudimg-arm64-containerd-vmlinuz.sha512sum"
            "dist/img/ubuntu-${version}-minimal-cloudimg-amd64-incus.qcow2"
            "dist/img/ubuntu-${version}-minimal-cloudimg-amd64-incus.qcow2.sha512sum"
            "dist/img/ubuntu-${version}-minimal-cloudimg-amd64-incus-vmlinuz"
            "dist/img/ubuntu-${version}-minimal-cloudimg-amd64-incus-vmlinuz.sha512sum"
            "dist/img/ubuntu-${version}-minimal-cloudimg-arm64-incus.qcow2"
            "dist/img/ubuntu-${version}-minimal-cloudimg-arm64-incus.qcow2.sha512sum"
            "dist/img/ubuntu-${version}-minimal-cloudimg-arm64-incus-vmlinuz"
            "dist/img/ubuntu-${version}-minimal-cloudimg-arm64-incus-vmlinuz.sha512sum"
          )

          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" --clobber "${files[@]}"
          else
            gh release create "${tag}" --draft --title "${tag}" "${files[@]}"
          fi

      - name: Close triggering issue
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.issue_number != ''
        run: |
          gh issue close "${{ github.event.inputs.issue_number }}" \
            --comment "Released in ${{ steps.tag.outputs.tag }}."
